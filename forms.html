<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <!-- 1. Form Setup -->
    <form action="">
      <!-- personal information -->
      <h2>Personal Information</h2>
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required /><br /><br> 

      <label for="fatherName">Father Name:</label>
      <input
        type="text"
        id="fatherName"
        name="fatherName"
        required
      /><br /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      /><br /><br />

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required /><br /><br />

      <label for="cnic">CNIC:</label>
      <input
        type="text"
        id="cnic"
        name="cnic"
        placeholder="12345-1234567-1"
        required
      /><br /><br />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required /><br /><br />

      <!-- gender radio selection -->
      <h2>Gender</h2>
      <input type="radio" id="male" name="gender" value="male" required />
      <label for="male">Male</label><br />
      <input type="radio" id="female" name="gender" value="female" required />
      <label for="female">Female</label><br /><br />

      <!-- skills checkbox selection -->
      <h2>Skills</h2>
      <input type="checkbox" id="html" name="skills" value="html" />
      <label for="html">HTML</label><br />
      <input type="checkbox" id="css" name="skills" value="css" />
      <label for="css">CSS</label><br />
      <input type="checkbox" id="javascript" name="skills" value="javascript" />
      <label for="javascript">JavaScript</label><br />
      <input type="checkbox" id="react" name="skills" value="react" />
      <label for="react">React</label><br /><br />

      <!-- education dropdown -->
      <h2>Education</h2>
      <label for="education">Select your education:</label>
      <select id="education" name="education" required>
        <option value="">-- Select --</option>
        <option value="matric">Matric</option>
        <option value="intermediate">Intermediate</option>
        <option value="bachelor">Bachelor</option>
        <option value="master">Master</option></select
      ><br /><br />

      <!-- city dropdown -->
      <h2>City</h2>
      <label for="city">Select your city:</label>
      <select id="city" name="city" required>
        <option value="">-- Select --</option>
        <option value="karachi">Karachi</option>
        <option value="lahore">Lahore</option>
        <option value="islamabad">Islamabad</option>
        <option value="peshawar">Peshawar</option>
        <option value="quetta">Quetta</option></select
      ><br /><br />

      <!-- document upload section -->
      <h2>Upload Documents</h2>
      <label for="picture">Upload Picture:</label>
      <input
        type="file"
        id="picture"
        name="picture"
        accept="image/,jpeg,.png"
      /><br /><br />

      <label for="cv">Upload CV:</label>
      <input
        type="file"
        id="cv"
        name="cv"
        accept=".pdf,.doc,.docx"
      /><br /><br />

      <!-- Address Section text area field -->
      <h2>Address</h2>
      <label for="address">Address:</label><br />
      <textarea
        id="address"
        name="address"
        rows="4"
        cols="50"
        required
      ></textarea
      ><br /><br />

      <!-- agreement checkbox -->
      <h2>Agreement</h2>
      <input
        type="checkbox"
        id="agreement"
        name="agreement"
        value="agree"
        required
      />
      <label for="agreement">I agree to the terms and conditions</label
      ><br /><br />

      <!-- submit and reset buttons -->
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
